[package]
name = "kopitiam-runtime"
# First crates.io release at 0.1.0; the workspace is 0.1.8 but these debut at 0.1.0 (maintainer directive).
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Kopitiam Runtime: the Qwen transformer forward pass (embedding, RoPE, grouped-query attention, SwiGLU MLP, KV cache, greedy sampling) running entirely in Rust on CPU."
# vendor/ holds a gitignored huggingface/transformers reference checkout
# (reference only, never compiled). Keep it out of the published .crate tarball.
exclude = ["vendor/"]

[features]
# GPU offload for the output projection (see src/gpu_offload.rs). ON by default:
# `kopitiam-gpu` handles a missing GPU at RUNTIME via its cascade, and it does
# compile cleanly for aarch64-linux-android, so Termux is not the reason for the
# gate. The gate exists so a build that wants nothing to do with wgpu — a lean
# Termux image, a minimal embedding — can say `--no-default-features` and not
# compile the graphics stack at all.
default = ["gpu"]
gpu = ["dep:kopitiam-gpu"]

[dependencies]
kopitiam-core.workspace = true
kopitiam-tensor.workspace = true
kopitiam-loader.workspace = true
kopitiam-tokenizer.workspace = true
kopitiam-gpu = { workspace = true, optional = true }

# Test-only: unique-by-construction temp file names for synthetic GGUF
# fixtures (see src/test_support/synthetic_gguf.rs). Already a workspace
# dependency (kopitiam-loader's own tests use it the same way); not part of
# the release build.
[dev-dependencies]
tempfile.workspace = true
# `tests/netfetch_end_to_end.rs` only: fetches REAL published weights so the
# whole chain (fetch -> load -> tokenize -> generate) is exercised against what
# HuggingFace actually ships, not against synthetic fixtures built the way this
# code already expects. Gated behind KOPITIAM_NETFETCH so an ordinary
# `cargo test` never touches the network. Dev-only, so nothing shipped depends
# on it and the layering (`runtime` knows nothing of model acquisition) holds.
kopitiam-models = { workspace = true }
kopitiam-tokenizer = { workspace = true }
