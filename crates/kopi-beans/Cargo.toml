# kopi-beans: a single-crate collapse of the `kopitiam-bds` fork of beads-rs
# (github.com/delightful-ai/beads-rs, MIT), relicensed AGPL-3.0-only as part of
# KOPITIAM, with Windows/Termux build support added. See NOTICE for provenance
# and the list of changes.
#
# This crate folds the former top `kopitiam-bds` package PLUS its nine sub-crates
# (beads-core, beads-api, beads-bootstrap, beads-surface, beads-macros, beads-cli,
# beads-git, beads-daemon, beads-daemon-core) into ONE publishable crate so it can
# go to crates.io without squatting upstream beads-rs's crate names. The nine
# sub-crates are now the intra-crate modules core/api/bootstrap/surface/macros/
# cli_surface/git/daemon/daemon_core.
#
# Dependency versions are pinned here deliberately (thiserror 1, uuid v5, gix,
# ...) exactly as the upstream fork pinned them, EXCEPT the two C-toolchain deps
# that were replaced with pure-Rust equivalents: rusqlite -> a pure-Rust
# MemoryWalIndex, and git2/libgit2 -> gitoxide (gix). See NOTICE. This crate does
# NOT inherit KOPITIAM's root workspace dependency set (mirrors how crates/kmux
# keeps the rmux fork's own pins).
[package]
name = "kopi-beans"
version = "0.1.5"
edition = "2024"
rust-version = "1.91"
publish = true
license = "AGPL-3.0-only"
repository = "https://github.com/theodoreOnzGit/kopitiam"
description = "A distributed, git-backed work-item tracker (the `bn` CLI). Single-crate collapse of a Windows/Termux-capable fork of beads-rs (MIT), relicensed AGPL-3.0-only."
authors = ["Darin <darinkishore@protonmail.com>", "Theodore Kay Chen Ong"]
keywords = ["cli", "git", "crdt", "issue-tracker", "agents"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
# Keep the packaged .crate lean and free of local dev state.
exclude = [".beads/", "**/*.md"]

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
tracing = "0.1"
tracing-tree = "0.3"
tracing-subscriber = { version = "0.3", features = ["ansi", "env-filter", "json"] }
tracing-appender = "0.2"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
crc32c = "0.6"
gix = { workspace = true }
crossbeam = "0.8"
signal-hook = "0.3"
whoami = "1.4"
# `dirs` is cross-platform (Windows/macOS/Linux/Android).
dirs = "6.0.0"
time = { version = "0.3", features = ["parsing", "formatting"] }
chrono = "0.4"
# `flate2`, `tar` and `ureq` were removed in kopitiam#14 together with the
# self-upgrade machinery that was their only consumer (it downloaded and unpacked
# a release tarball over HTTPS). Dropping `ureq` also drops its TLS stack — `ring`
# / `aws-lc-sys` — and with it a C toolchain requirement, which matters because
# this crate is meant to build natively on Termux/Android. Do not re-add them
# without a consumer.
toml = "0.8"
tempfile = "3"
bytes = "1"
minicbor = { version = "0.24", features = ["std"] }

# Unix-only process/user/signal facilities. On Windows the code paths that need
# these are replaced under `#[cfg(windows)]` (see the surface/ and daemon/ modules,
# src/paths.rs, src/telemetry.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["fs", "signal", "user"] }

# Windows equivalents. `uds_windows` provides std-compatible UnixStream/
# UnixListener over Windows AF_UNIX (used by the surface module's `ipc::uds`
# alias); `fs2` backs the `LockFileEx` advisory-lock shim in the daemon module;
# `windows-sys` backs process liveness/termination (there is no `kill(pid, 0)`).
[target.'cfg(windows)'.dependencies]
fs2 = "0.4"
uds_windows = "1.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[features]
default = ["cli", "wal-fs"]
# `cli` gates the top-level `cli` module + `run_cli_entrypoint`/`bn` binary.
cli = []
# WAL backend in the daemon_core module (formerly a beads-daemon-core feature).
# `wal-fs` is the pure-Rust filesystem WAL (the durable source of truth). The WAL
# index is a rebuildable in-memory materialized view (`MemoryWalIndex`), so there
# is no separate index-backend feature and no C SQLite dependency: `bn`
# cross-compiles to Termux/Android with no NDK/C toolchain.
wal-fs = []
# Was `beads-*/test-harness`; now a single crate-wide gate.
test-harness = []
slow-tests = []
model-testing = []
# Dev-only gate for the `bn-tailnet-proxy` fault-injection binary (see the [[bin]]
# section below and kopitiam#15). NOT in `default`, so `cargo install kopi-beans`
# installs `bn` and nothing else. Deliberately a feature of its own rather than a
# reuse of `test-harness`: it turns on one extra binary and no library `cfg`, so it
# stays buildable independently of the `test-harness` code paths.
fault-proxy = []
# The end-to-end suite wants both the in-process harness hooks and the out-of-process
# fault proxy, so it enables them together.
e2e-tests = ["test-harness", "fault-proxy"]

# The library keeps the upstream crate name `beads_rs`: the folded source, the
# `bn` binary, and the fault-injection `bn-tailnet-proxy` binary refer to
# `beads_rs::...`. The published PACKAGE is `kopi-beans`; the lib name is a
# separate namespace and squats nothing on crates.io.
[lib]
name = "beads_rs"
path = "src/lib.rs"

[[bin]]
name = "bn"
path = "src/bin/main.rs"
required-features = ["cli"]

# Tailnet-style replication proxy for deterministic network fault injection. This
# is DEV/TEST TOOLING, not part of the `bn` issue tracker: it exists to exercise the
# daemon's replication layer under latency, loss, reordering and blackholes. Kept
# from the upstream fork; refers to the library as `beads_rs::core` /
# `beads_rs::daemon_core`.
#
# Two deliberate properties (see kopitiam#15):
#   1. `required-features = ["fault-proxy"]` — `fault-proxy` is NOT in `default`, so
#      `cargo install kopi-beans` skips this binary entirely and installs only `bn`.
#      Build it with `--features fault-proxy` when you actually want it.
#   2. The binary is named `bn-tailnet-proxy`, not the bare `tailnet_proxy` it used
#      to be. Even when someone opts in with `--all-features`, the name is prefixed
#      so it cannot collide with (or be clobbered by) another crate's binary, and a
#      user reading `~/.cargo/bin` can tell which package owns it.
#
# Why `required-features` and not `examples/`: this file carries its own
# `#[cfg(test)]` unit tests (the fault-profile constants), which `cargo test` runs
# for a `[[bin]]` but NOT for an example, and an example would also be rebuilt on
# every plain `cargo build`/`cargo test`.
#
# Why a dedicated `fault-proxy` feature and not the existing `test-harness`: gating
# on `test-harness` would make this binary unbuildable whenever the `test-harness`
# library paths are broken. Keeping the gate independent means the proxy can always
# be built and verified on its own, no matter what state the harness code is in.
#
# That is not hypothetical, hor — it already happened once. Until kopitiam#17 was
# fixed, `src/daemon/testkit/e2e.rs:3` carried `use crate as crate::daemon;` (the
# sub-crate collapse rewrote BOTH sides of an old `use crate as beads_daemon;`
# self-alias, and `as` only takes a plain identifier, never a path). So
# `--features test-harness` could not even PARSE, and had this binary been gated on
# it, we would have shipped a binary nobody could build. `test-harness` compiles
# again now, but the argument for keeping the two gates independent stands on its
# own and this separation should NOT be tidied away.
[[bin]]
name = "bn-tailnet-proxy"
path = "src/bin/bn_tailnet_proxy.rs"
required-features = ["fault-proxy"]

[dev-dependencies]
proptest = "1"
tempfile = "3"
bytes = "1"
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
tokio = { version = "1", features = ["rt", "net"] }
