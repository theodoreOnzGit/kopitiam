# kopitiam-bds: a fork of beads-rs (github.com/delightful-ai/beads-rs, MIT),
# relicensed AGPL-3.0-only as part of KOPITIAM, with Windows build support added.
# See NOTICE for provenance and the list of changes.
#
# NOT `edition.workspace = true` / not inheriting KOPITIAM's root workspace
# dependency set. This crate and its nested sub-crates are a fork of beads-rs
# with its OWN pinned dependency versions (thiserror 1, uuid v5, etc.) that
# differ from KOPITIAM's root. Silently unifying them with the root workspace's
# deps is a behavioural change nobody asked for and makes every future upstream
# merge harder. Versions/edition are pinned here deliberately, exactly as
# crates/kmux does for the rmux fork.
[package]
name = "kopitiam-bds"
version = "0.2.0-kopitiam.1"
edition = "2024"
rust-version = "1.91"
publish = false
license = "AGPL-3.0-only"
repository = "https://github.com/theodoreOnzGit/kopitiam"
description = "kopitiam-bds: a distributed work-item tracker (the `bd` CLI) for KOPITIAM. A fork of beads-rs (MIT) with Windows support added, relicensed AGPL-3.0-only."
authors = ["Darin <darinkishore@protonmail.com>", "Theodore Kay Chen Ong"]
keywords = ["cli", "git", "crdt", "issue-tracker", "agents"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
exclude = [".beads/"]

# Dual CLI + library crate

[dependencies]
beads-core = { path = "crates/beads-core" }
beads-api = { path = "crates/beads-api" }
beads-bootstrap = { path = "crates/beads-bootstrap" }
beads-surface = { path = "crates/beads-surface" }
beads-macros = { path = "crates/beads-macros" }
beads-cli = { path = "crates/beads-cli" }
beads-git = { path = "crates/beads-git" }
beads-daemon = { path = "crates/beads-daemon" }
beads-daemon-core = { path = "crates/beads-daemon-core", features = ["wal-sqlite", "wal-fs"] }
clap = { version = "4", features = ["derive"], optional = true }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
tracing = "0.1"
tracing-tree = "0.3"
tracing-subscriber = { version = "0.3", features = ["ansi", "env-filter", "json"] }
tracing-appender = "0.2"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
crc32c = "0.6"
# `vendored-openssl` is added only on unix (below). libgit2's HTTPS transport
# on Windows uses the native WinHTTP/SChannel backend, so building OpenSSL from
# source there is both unnecessary and painful. Feature unification applies the
# unix `vendored-openssl` to the single git2 build across all sub-crates.
git2 = { version = "0.20", features = ["vendored-libgit2"] }
crossbeam = "0.8"
signal-hook = "0.3"
whoami = "1.4"
# `dirs` is cross-platform (Windows/macOS/Linux/Android).
dirs = "6.0.0"
time = { version = "0.3", features = ["parsing", "formatting"] }
chrono = "0.4"
flate2 = "1"
tar = "0.4"
toml = "0.8"
ureq = { version = "2", default-features = true }
tempfile = "3"
bytes = "1"
minicbor = { version = "0.24", features = ["std"] }
# `bundled` compiles SQLite from source via `cc` on every platform, so the `bd`
# binary does not depend on a system libsqlite3 being present (there is none on
# a stock Windows box). Additive with beads-daemon-core's own rusqlite feature.
rusqlite = { version = "0.31", features = ["bundled"] }

# Unix-only process/user/signal facilities. On Windows the code paths that need
# these are replaced under `#[cfg(windows)]` (see src/paths.rs, src/telemetry.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["signal", "user"] }
# On unix, libgit2 needs a TLS backend built from source for portable HTTPS.
git2 = { version = "0.20", features = ["vendored-openssl"] }

[features]
default = ["cli"]
cli = ["clap"]
slow-tests = []
test-harness = ["beads-core/test-harness", "beads-daemon/test-harness", "beads-daemon-core/test-harness"]
e2e-tests = ["test-harness"]
model-testing = []

# The library keeps the upstream crate name `beads_rs` even though the package
# is renamed `kopitiam-bds`. Upstream source (and this crate's own bin/tests)
# refer to `beads_rs::...`; keeping the lib name avoids a churny rename across
# the whole tree and keeps future upstream merges clean (mirrors how kmux keeps
# the `rmux-*` names on its forked sub-crates).
[lib]
name = "beads_rs"
path = "src/lib.rs"

[[bin]]
name = "bd"
path = "src/bin/main.rs"
required-features = ["cli"]

[dev-dependencies]
assert_cmd = "2"
pathdiff = "0.2.3"
predicates = "3"
proptest = "1"
beads-http = { path = "crates/beads-http" }
beads-daemon = { path = "crates/beads-daemon", features = ["test-harness"] }
beads-daemon-core = { path = "crates/beads-daemon-core", features = ["test-harness", "wal-sqlite", "wal-fs"] }
tokio = { version = "1", features = ["rt", "net"] }
