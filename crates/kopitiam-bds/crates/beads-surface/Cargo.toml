[package]
name = "beads-surface"
version = "0.2.0-kopitiam.1"
edition = "2024"
rust-version = "1.91"
license = "AGPL-3.0-only"
repository = "https://github.com/theodoreOnzGit/kopitiam"
description = "IPC and CLI surface types for beads-rs"

[dependencies]
beads-core = { path = "../beads-core" }
beads-api = { path = "../beads-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

# The IPC transport is a Unix-domain socket. On unix that comes from std;
# `nix` provides pid-liveness (`kill(pid, 0)`) and the raw daemon spawner.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "user"] }

# Windows 10 (1803+) supports AF_UNIX sockets with filesystem paths, but Rust's
# std does not expose them; `uds_windows` provides std-compatible UnixStream /
# UnixListener over them, so the socket-path logic is unchanged. `windows-sys`
# backs process liveness / termination (there is no `kill(pid, 0)` on Windows).
[target.'cfg(windows)'.dependencies]
uds_windows = "1.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
# Optional; available for future tests.
tempfile = "3"
