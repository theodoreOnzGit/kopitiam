[package]
name = "beads-bootstrap"
version = "0.2.0-kopitiam.1"
edition = "2024"
rust-version = "1.91"
license = "AGPL-3.0-only"
repository = "https://github.com/theodoreOnzGit/kopitiam"
description = "Pure bootstrap helpers for beads path and config discovery"

[dependencies]
beads-core = { path = "../beads-core" }
dirs = "6.0.0"
git2 = { version = "0.20", features = ["vendored-libgit2"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
uuid = { version = "1", features = ["serde", "v4", "v5"] }