[package]
name = "beads-daemon-core"
version = "0.2.0-kopitiam.1"
edition = "2024"
rust-version = "1.91"
license = "AGPL-3.0-only"
repository = "https://github.com/theodoreOnzGit/kopitiam"
description = "Shared daemon protocol and WAL primitives for beads-rs"

[features]
default = []
wal-sqlite = ["dep:rusqlite"]
wal-fs = ["dep:dirs", "dep:rand", "dep:toml", "dep:tracing"]
test-harness = []
model-testing = []

[dependencies]
beads-core = { path = "../beads-core" }
crc32c = "0.6"
hex = "0.4"
bytes = "1"
minicbor = { version = "0.24", features = ["std"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
dirs = { version = "6.0.0", optional = true }
rand = { version = "0.9", optional = true }
rusqlite = { version = "0.31", optional = true }
toml = { version = "0.8", optional = true }
tracing = { version = "0.1", optional = true }
[dev-dependencies]
uuid = { version = "1", features = ["serde", "v4", "v5"] }
tempfile = "3"
