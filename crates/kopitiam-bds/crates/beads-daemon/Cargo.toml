[package]
name = "beads-daemon"
version = "0.2.0-kopitiam.1"
edition = "2024"
rust-version = "1.91"
license = "AGPL-3.0-only"
repository = "https://github.com/theodoreOnzGit/kopitiam"
description = "Daemon runtime crate for beads-rs"

[features]
default = []
slow-tests = []
test-harness = ["beads-core/test-harness", "beads-daemon-core/test-harness"]
model-testing = []

[dependencies]
beads-core = { path = "../beads-core" }
beads-api = { path = "../beads-api" }
beads-bootstrap = { path = "../beads-bootstrap" }
beads-surface = { path = "../beads-surface" }
beads-macros = { path = "../beads-macros" }
beads-git = { path = "../beads-git" }
beads-daemon-core = { path = "../beads-daemon-core", features = ["wal-sqlite", "wal-fs"] }
crossbeam = "0.8"
git2 = { version = "0.20", features = ["vendored-libgit2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
crc32c = "0.6"
whoami = "1.4"
time = { version = "0.3", features = ["parsing", "formatting"] }
dirs = "6.0.0"
chrono = "0.4"
flate2 = "1"
tar = "0.4"
toml = "0.8"
ureq = { version = "2", default-features = true }
tempfile = "3"
bytes = "1"
minicbor = { version = "0.24", features = ["std"] }
rusqlite = "0.31"
tracing-subscriber = { version = "0.3", features = ["ansi", "env-filter", "json"] }
tracing-appender = "0.2"
tracing-tree = "0.3"
thiserror = "1"
tracing = "0.1"

# Unix daemon plumbing: POSIX signals (SIGTERM/SIGINT graceful shutdown),
# advisory file locking (`nix::fcntl::Flock`), and pid liveness (`kill(pid,0)`).
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"
nix = { version = "0.29", features = ["fs", "signal", "user"] }

# Windows equivalents: `fs2` provides LockFileEx-backed advisory locking behind
# the `Flock` shim (runtime/store/win_lock.rs); `windows-sys` backs pid
# liveness / termination (runtime/win_process.rs). The UnixListener/UnixStream
# types come from beads-surface's `ipc::uds` alias (uds_windows), not here.
[target.'cfg(windows)'.dependencies]
fs2 = "0.4"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
bytes = "1"
uuid = { version = "1", features = ["serde", "v4", "v5"] }