[package]
name = "beads-http"
version = "0.2.0-kopitiam.1"
edition = "2024"
rust-version = "1.91"
license = "AGPL-3.0-only"
repository = "https://github.com/theodoreOnzGit/kopitiam"
description = "HTTP transport for the beads daemon Request/Response surface"

[dependencies]
beads-core = { path = "../beads-core" }
beads-surface = { path = "../beads-surface" }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["ansi", "env-filter"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
