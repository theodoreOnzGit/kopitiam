[package]
name = "beads-core"
version = "0.2.0-kopitiam.1"
edition = "2024"
rust-version = "1.91"
license = "AGPL-3.0-only"
repository = "https://github.com/theodoreOnzGit/kopitiam"
description = "Core domain types and CRDT primitives for beads-rs"

[features]
test-harness = []

[dependencies]
beads-macros = { path = "../beads-macros" }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
sha2 = "0.10"
bytes = "1"
minicbor = { version = "0.24", features = ["std"] }
rand = "0.9"
toml = "0.8"

[dev-dependencies]
proptest = "1"
