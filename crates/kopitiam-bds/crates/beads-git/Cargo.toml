[package]
name = "beads-git"
version = "0.2.0-kopitiam.1"
edition = "2024"
rust-version = "1.91"
license = "AGPL-3.0-only"
repository = "https://github.com/theodoreOnzGit/kopitiam"
description = "Git sync and checkpoint subsystem for beads"

[dependencies]
beads-core = { path = "../beads-core" }
beads-bootstrap = { path = "../beads-bootstrap" }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
hex = "0.4"
bytes = "1"
git2 = { version = "0.20", features = ["vendored-libgit2"] }
flate2 = "1"
tar = "0.4"
tempfile = "3"
dirs = "6.0.0"

# Only used for backup-ref lock pid-liveness (`kill(pid, 0)`), which already has
# a `#[cfg(not(unix))]` fallback in src/sync.rs.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "user"] }

[features]
default = []
slow-tests = []

[dev-dependencies]
proptest = "1"
uuid = { version = "1", features = ["serde", "v4", "v5"] }