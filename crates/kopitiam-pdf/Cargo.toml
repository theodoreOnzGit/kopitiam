[package]
name = "kopitiam-pdf"
# Pinned, not `version.workspace = true`: per CLAUDE.md's "no new commits, no
# version bump" hard rule, a crate's version moves only when that crate's own
# code moved. kopitiam-pdf was untouched since the workspace-wide 0.2.5
# publish (2026-07-29) until this Type1/predefined-CFF glyph-outline change
# (issue #31), so it gets its own bump here rather than inheriting whatever
# the workspace version is next, which would silently re-version every
# untouched crate too.
version = "0.2.7"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust PDF text extraction for KOPITIAM's Document Engine."
# Keep vendored MuPDF/PyMuPDF/pdfminer/pypdf reference sources (crates/kopitiam-pdf/vendor/,
# ~340MB, AGPL/MIT/BSD, local-only for the C->Rust translation) OUT of the published
# .crate. Belt-and-braces alongside the .gitignore rule; publish.sh's preflight requires it.
exclude = ["vendor/"]

[dependencies]
pdf-extract = { workspace = true }
# See the workspace Cargo.toml comment next to `lopdf`: this is already a
# transitive dependency of pdf-extract, promoted to direct so
# `font_resources.rs` can walk font resource dictionaries and content
# streams for font style recovery (kopitiam-q4f).
lopdf = { workspace = true }
thiserror = { workspace = true }
# Pure-Rust DEFLATE/inflate for the MuPDF port's FlateDecode filter
# (crates/kopitiam-pdf/src/mupdf/filter_flate.rs). Substitutes MuPDF's C
# `<zlib.h>` dependency; the filter wiring is still translated from
# source/fitz/filter-flate.c. See the workspace Cargo.toml note.
miniz_oxide = { workspace = true }
# Pure-Rust JPEG decoder for the MuPDF port's embedded-image layer
# (crates/kopitiam-pdf/src/mupdf/page_image.rs), decoding DCTDecode Image
# XObjects. Substitutes MuPDF's C `<jpeglib.h>` (source/fitz/load-jpeg.c); no C
# toolchain (build = false). See the workspace Cargo.toml note and AID-0051.
zune-jpeg = { workspace = true }
# Cross-engine graceful fallback (mupdf/hayro_fallback.rs): when
# kopitiam-pdf's own glyph decoders hit their documented ceiling and would
# otherwise paint an advance box, `rasterize_page` re-renders the page with
# `hayro` (https://github.com/LaurenzV/hayro) instead of returning boxes.
# Pure Rust top to bottom (verified: no C/C++/Fortran anywhere in its own
# dependency chain), per CLAUDE.md's Pure Rust Core "prefer an existing
# crate" hard rule. Mandatory, not optional: per the maintainer's explicit
# instruction, this is load-bearing for every renderer in the workspace, not
# an opt-in extra. Pinned exactly (not a semver range) per the maintainer's
# instruction -- this crate moves fast (0.1.0 to 0.7.1 in about seven
# months) and we bump deliberately rather than drift with it.
hayro = "=0.7.1"

[dev-dependencies]
# `examples/kpdf.rs` -- a lightweight native GUI viewer, dev-dependency only so
# egui/eframe never enter the published library's own dependency graph (a
# `cargo publish` consumer never needs a GUI toolkit to use kopitiam-pdf as a
# library). MIT OR Apache-2.0, pure Rust.
eframe = "0.36"
egui = "0.36"
# Native "Open a PDF" file picker for kpdf. MIT. Default features
# (xdg-portal + wayland on Linux) are pure Rust to build -- no GTK/C toolchain
# needed, per the Pure Rust Core hard rule's "prefer an existing pure-Rust
# crate" and "avoid a C dependency's own complex build system" guidance.
rfd = "0.17"
