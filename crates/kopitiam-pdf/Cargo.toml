[package]
name = "kopitiam-pdf"
# Pinned, not `version.workspace = true`: per CLAUDE.md's "no new commits, no
# version bump" hard rule, a crate's version moves only when that crate's own
# code moved, not in lockstep with the shared workspace version. kopitiam-pdf
# was untouched since the workspace-wide 0.2.5 publish (2026-07-29) until the
# Type1/predefined-CFF glyph-outline change (issue #31) took it to 0.2.6, the
# mandatory `hayro` graceful fallback took it to 0.2.7, and the object-stream
# cache-poisoning fix (gh-70, `claimed_by_objstm` in xref.rs) takes it to
# 0.2.8. That last one landed AFTER 0.2.7 was already on crates.io -- verified
# by diffing the published .crate, which has no such guard -- so it needs its
# own version rather than riding along on one already spent. 0.2.9 adds
# annotation rendering + authoring (gh-79/gh-80), the stroker cap/join port
# (gh-82), and promotes kpdf from an example to a real binary.
#
# The wrinkle worth remembering (it has already caught us once, on develop's
# 6facc3b "bumping kopitiam pdf to version 0.2.6"): bumping the
# `[workspace.dependencies]` requirement string in the root Cargo.toml only
# changes what *other* crates resolve against -- it does NOT change what
# `cargo publish` uploads. The crate's own `[package] version` here is the
# other half, and both have to move together.
version = "0.2.9"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust PDF text extraction for KOPITIAM's Document Engine."
# Keep vendored MuPDF/PyMuPDF/pdfminer/pypdf reference sources (crates/kopitiam-pdf/vendor/,
# ~340MB, AGPL/MIT/BSD, local-only for the C->Rust translation) OUT of the published
# .crate. Belt-and-braces alongside the .gitignore rule; publish.sh's preflight requires it.
exclude = ["vendor/"]

[dependencies]
pdf-extract = { workspace = true }
# See the workspace Cargo.toml comment next to `lopdf`: this is already a
# transitive dependency of pdf-extract, promoted to direct so
# `font_resources.rs` can walk font resource dictionaries and content
# streams for font style recovery (kopitiam-q4f).
lopdf = { workspace = true }
thiserror = { workspace = true }
# Pure-Rust DEFLATE/inflate for the MuPDF port's FlateDecode filter
# (crates/kopitiam-pdf/src/mupdf/filter_flate.rs). Substitutes MuPDF's C
# `<zlib.h>` dependency; the filter wiring is still translated from
# source/fitz/filter-flate.c. See the workspace Cargo.toml note.
miniz_oxide = { workspace = true }
# Pure-Rust JPEG decoder for the MuPDF port's embedded-image layer
# (crates/kopitiam-pdf/src/mupdf/page_image.rs), decoding DCTDecode Image
# XObjects. Substitutes MuPDF's C `<jpeglib.h>` (source/fitz/load-jpeg.c); no C
# toolchain (build = false). See the workspace Cargo.toml note and AID-0051.
zune-jpeg = { workspace = true }
# Cross-engine graceful fallback (mupdf/hayro_fallback.rs): when
# kopitiam-pdf's own glyph decoders hit their documented ceiling and would
# otherwise paint an advance box, `rasterize_page` re-renders the page with
# `hayro` (https://github.com/LaurenzV/hayro) instead of returning boxes.
# Pure Rust top to bottom (verified: no C/C++/Fortran anywhere in its own
# dependency chain), per CLAUDE.md's Pure Rust Core "prefer an existing
# crate" hard rule. Mandatory, not optional: per the maintainer's explicit
# instruction, this is load-bearing for every renderer in the workspace, not
# an opt-in extra. Pinned exactly (not a semver range) per the maintainer's
# instruction -- this crate moves fast (0.1.0 to 0.7.1 in about seven
# months) and we bump deliberately rather than drift with it.
hayro = "=0.7.1"

# Embedded-font glyph outlines (`mupdf/glyph_skrifa.rs`), used as a second
# opinion when this crate's own from-spec decoders cannot produce an outline.
# Part of googlefonts/fontations: pure Rust, no C toolchain, MIT OR Apache-2.0
# (absorbs into AGPL-3.0 with notices), actively maintained.
#
# Adopted per CLAUDE.md's Pure Rust Core hard rule -- "prefer an existing,
# actively-maintained pure-Rust crate over writing a new implementation" --
# which deliberately reverses the older AID-0055 precedent of writing font
# decoding from spec. It does NOT replace the hayro fallback (the maintainer
# was explicit: do not delete it) and it does NOT cover Type1 `/FontFile`,
# which is outside skrifa's OpenType scope and stays with `glyph_type1.rs`.
#
# ## Why 0.42 and not the newest -- KEEP IT IN STEP WITH hayro
#
# `hayro-interpret 0.7.0` (under our pinned `hayro =0.7.1`) requires
# `skrifa ^0.42.0`. Asking for `"0.46"` here does NOT conflict -- cargo simply
# builds BOTH, because for `0.x` a caret pins the minor, so 0.42 and 0.46 are
# separate incompatible majors as far as resolution is concerned. It compiles
# and it passes; it just silently carries a second full copy of the font stack.
#
# Matching hayro's requirement makes the two share one copy instead
# (measured: skrifa copies in this crate's tree went 3 -> 2).
#
# We cannot get to ONE copy: hayro wants `^0.42`, `epaint`/egui wants `0.44`,
# and those two disagree with each other. So the only real choice is which of
# them we share with, and BOTH were tested -- 0.42 and 0.44 each compile and
# each leave exactly two copies. The maintainer okayed either.
#
# 0.42 (hayro's) wins on one concrete point: hayro is the FALLBACK RENDERER FOR
# THE SAME FONTS. When `hayro_fallback.rs` re-renders a page, the glyph
# decoding underneath should be the same skrifa our own path used -- otherwise
# two engines can disagree about one font in one document, which is a rendering
# divergence rather than a build-time cost. egui's copy only lays out UI text
# and never meets a PDF font at all, so sharing with it buys nothing.
#
# So: **when bumping this, check what `hayro-interpret` asks for first** and
# move both together. Bumping skrifa alone re-forks the dependency without any
# error to warn you. Nothing today passes a skrifa type across the hayro
# boundary (`hayro_fallback.rs` trades only `&[u8]` and a `Pixmap`), so the
# cost of drifting is duplicate build time rather than a type mismatch -- but
# that stops being true the moment either side exposes skrifa types in its API.
skrifa = "0.42"

# --- kpdf GUI stack (optional, behind the default `kpdf` feature) -------------
# `src/bin/kpdf.rs` -- a lightweight native PDF reader. These were
# `[dev-dependencies]` while kpdf was an example; promoting kpdf to a real
# binary means they must be real dependencies, and `optional = true` keeps them
# out of a library-only build (see `[features]` below).
# MIT OR Apache-2.0, pure Rust.
eframe = { version = "0.36", optional = true }
egui = { version = "0.36", optional = true }
# Native file picker ("Open a PDF"). MIT. Default features (xdg-portal +
# wayland on Linux) are pure Rust to build -- no GTK/C toolchain needed, per the
# Pure Rust Core hard rule's "prefer an existing pure-Rust crate" and "avoid a C
# dependency's own complex build system" guidance.
rfd = { version = "0.17", optional = true }

[dev-dependencies]
# Nothing here today: the GUI stack that used to live in this section is now an
# optional *real* dependency (see `[features] kpdf` above), because kpdf is a
# shipped binary rather than an example.

[features]
# `kpdf` -- the native GUI viewer binary. ON by default so `cargo install
# kopitiam-pdf` just works and produces a usable reader with no flags.
#
# The deps below are `optional = true` rather than plain dependencies, which is
# the whole point of this feature: a consumer using kopitiam-pdf as a *library*
# (apps/cli, kovan, anything downstream) can take `default-features = false` and
# never compile a GUI toolkit it does not render with. That preserves the
# property the old `[dev-dependencies]` comment was protecting -- "a `cargo
# publish` consumer never needs a GUI toolkit to use kopitiam-pdf as a library"
# -- while still shipping the binary the maintainer asked for.
#
# Turning this from a default feature into a non-default one later is NOT a
# breaking change for library users; going the other way (hard dependency ->
# optional) would be. Hence optional-from-the-start.
default = ["kpdf"]
kpdf = ["dep:eframe", "dep:egui", "dep:rfd"]

[[bin]]
name = "kpdf"
path = "src/bin/kpdf.rs"
# Without this, `cargo build --no-default-features` would try to build the
# binary with its GUI deps switched off and fail to compile. `required-features`
# makes cargo skip the target instead, so a library-only build is clean.
required-features = ["kpdf"]
