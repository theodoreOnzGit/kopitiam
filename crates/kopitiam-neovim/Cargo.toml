[package]
name = "kopitiam-neovim"
# Pinned, not `version.workspace`: per CLAUDE.md "no new commits, no version bump",
# only crates whose code moved get bumped. 0.4.1 = gh-118 follow-up: the Lua
# config layer comes back, but ONLY behind the off-by-default `lua` feature, so
# the default build is 0.4.0 exactly plus nothing -- additive, a patch. See
# AID-0061. 0.4.0, not 0.3.1, was: gh-118 removes the
# public `luaconfig` module, `Config::lua_files`, and the `Action::LuaKeymap` /
# `Action::FeedKeys` variants — all breaking under Cargo's SemVer rules. See
# AID-0060. (0.3.0 was gh-117's new `Action::LspCodeAction` variant, AID-0059.)
version = "0.4.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "kvim: a Rust-native, Android-capable modal editor with Vim keybindings and plugin behaviour built in — no Lua plugins, no Mason. Unrelated to KDE/Plasma."
readme = "README.md"
keywords = ["vim", "neovim", "editor", "modal", "tui"]
categories = ["text-editors", "command-line-utilities"]

# The maintainer explicitly asked that `cargo install kopitiam-neovim` yield a
# `kvim` binary, which is why the binary lives in this engine crate rather than
# under apps/ like KOPITIAM's other clients. See
# docs/ai-decisions/AID-0003-kopitiam-neovim-architecture.md, decision 4.
[[bin]]
name = "kvim"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
regex.workspace = true

# The LSP client. KOPITIAM already drives a live rust-analyzer over stdio for
# `kopitiam rename` / `kopitiam code-actions`, so kvim reuses that client rather
# than growing a second one.
kopitiam-semantic.workspace = true

# Pure-Rust, line-oriented syntax highlighting (Rust/TOML/Lua/LaTeX/Markdown/
# Python). Hand-written lexers, NOT tree-sitter — tree-sitter's core and every
# grammar pull in `cc`, which would break the Pure Rust Core promise on Android.
# See docs/ai-decisions/AID-0009-syntax-highlighting.md.
kopitiam-syntax.workspace = true
kopitiam-snippet.workspace = true

# The ~/.kopitiam per-user directory convention, shared with every other
# KOPITIAM app.
kopitiam-config.workspace = true

# `kopitiam-lua` is OPTIONAL -- pulled in only by the `lua` feature below, which
# is OFF by default. kvim used to run init.lua through a `vim.*` shim on that VM
# unconditionally (AID-0034); the maintainer reversed that on 2026-10-06
# ("kopitiam-neovim shouldn't need to read lua, i want my preferences hardcoded
# in", AID-0060), then asked the same day to "keep kopitiam-lua as a feature
# gated dependency ... off by default" (AID-0061). So a default build carry the
# preferences compiled in as data and never read or run Lua -- the VM is not
# even compiled. `--features lua` brings back the shim exactly as it was.
kopitiam-lua = { workspace = true, optional = true }

# Text engine. `ropey` is pure Rust, is the rope behind Helix, and is O(log n)
# for the index/edit operations an editor performs constantly.
ropey = "1.6"

# Terminal I/O and rendering. Both are pure Rust and both build for
# aarch64-linux-android, which is the entire point of this crate.
crossterm = "0.29"
ratatui = "0.29"

# Correct cursor movement over CJK/emoji/combining marks. A byte- or
# char-indexed editor gets this wrong; a grapheme-indexed one does not.
unicode-segmentation = "1"
unicode-width = "0.2"

# Fuzzy matching for the telescope replacement. Pure Rust, by the Helix authors.
nucleo = "0.5"

# Directory walking that honours .gitignore, for the file tree and file picker.
ignore = "0.4"

# Device probe for the resource-aware LSP guard: available/total RAM, CPU core
# count + live usage, and (future) per-process RSS. Pure Rust, Android-capable,
# library-only. See `src/lsp/resource_guard.rs` for why one dep serves three
# features. Workspace-pinned so the version tracks the rest of the tree.
sysinfo.workspace = true

# The `:term` terminal emulator. `portable-pty` spawns `$SHELL` (or the given
# command) inside a real pseudo-terminal; `vt100` parses the pty's raw output
# into a `Screen` grid kvim paints into a window. Both pure Rust, both build for
# aarch64-linux-android so `:term` works in Termux. A background reader thread
# drains the pty into the vt100 parser behind a mutex (the AID-0028 actor
# discipline). See `src/termemu.rs` and AID-0049.
portable-pty.workspace = true
vt100.workspace = true

[features]
# Default build is Lua-free (0.4.0 behaviour). Hor, don't add `lua` here -- the
# maintainer wants it OFF by default (AID-0061, gh-118).
default = []
# Opt-in: execute ~/.kopitiam/kopitiam-neovim/init.lua (+ lua/*.lua) at startup
# through the `vim.*` shim on the pure-Rust `kopitiam-lua` VM (AID-0034). Adds
# the `luaconfig` module, `Config::lua_files`, `Action::{FeedKeys, LuaKeymap}`
# and `App::{set_lua_runtime, set_startup_message}`.
#   cargo install kopitiam-neovim --features lua
lua = ["dep:kopitiam-lua"]

[dev-dependencies]
tempfile.workspace = true
