[package]
name = "kopitiam-document"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Structural document reconstruction (paragraphs, headings, tables, columns) for KOPITIAM's Document Engine."
# Keep vendored pdf-to-markdown/pdfplumber reference sources (crates/kopitiam-document/vendor/,
# MIT, local-only for translation) OUT of the published .crate. Belt-and-braces alongside
# .gitignore; publish.sh's preflight requires it.
exclude = ["vendor/"]

[dependencies]
kopitiam-pdf = { workspace = true }
regex = { workspace = true }
