[workspace]
resolver = "2"

members = [
    "apps/*",
    "crates/*",
    # kmux WAS a fork of rmux that nested its forked sub-crates under its own
    # `crates/`. It has since been collapsed into ONE self-contained crate
    # (crates/kmux) so it can publish to crates.io without squatting upstream
    # rmux's crate names -- the former rmux-* sub-crates are now intra-crate
    # modules of `kmux` (see crates/kmux/src/lib.rs and NOTICE). It is now a
    # plain `crates/*` member picked up by the glob above; no nested members.
]
# kopi-beans (the `bn` work-item tracker) is a single-crate collapse of the
# former multi-crate kopitiam-bds fork of beads-rs. It is a normal member
# picked up by the `crates/*` glob above; it no longer nests sub-crates.

[workspace.package]
version = "0.2.4"
edition = "2024"
authors = ["Theodore Kay Chen Ong"]
license = "AGPL-3.0-only"
repository = "https://github.com/theodoreOnzGit/kopitiam"

[workspace.dependencies]
uom = { version = "0.38", features = ["f64", "si"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Linear algebra / n-dimensional arrays
nalgebra = "0.34"
ndarray = "0.16"

# GPU parallel-compute foundation (kopitiam-gpu). wgpu is NON-OPTIONAL at compile
# on purpose -- no feature gate -- so the GPU path is always in the binary and the
# absence of a GPU is handled at RUNTIME by a Result cascade (GPU -> CPU), never
# by a build-time cfg. wgpu Cargo-builds with pure-Rust backends (no C toolchain
# at build time); it only needs GPU drivers at RUNTIME. See AID-0037.
# `pollster` blocks on wgpu's async adapter/device/buffer-map futures; `bytemuck`
# reinterprets `&[f32]` as the `&[u8]` byte slices wgpu buffers speak.
wgpu = "30"
pollster = "0.4"
bytemuck = "1"

# Utilities
itertools = "0.14"
indexmap = "2"
regex = "1"
camino = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# PDF extraction (pure Rust: pdf-extract wraps lopdf)
pdf-extract = "0.12"
# Pure-Rust DEFLATE/zlib (the algorithm behind PDF's FlateDecode). Used by the
# MuPDF port's `filter_flate.rs`, which wires miniz_oxide's streaming inflate
# into an fz_stream-style filter in place of MuPDF's `<zlib.h>` dependency (the
# C we translate calls zlib; we substitute the pure-Rust equivalent, keeping the
# filter plumbing faithful). Already present in Cargo.lock as a transitive dep
# (via flate2), so promoting it to a direct workspace dep adds no new crate to
# the tree. Pure Rust, no C toolchain.
miniz_oxide = "0.8"
# `lopdf` is already pulled in transitively by `pdf-extract` (pinned to the
# same "0.42" line here so Cargo unifies to the one copy already present,
# adding no new crate to the dependency tree). kopitiam-pdf depends on it
# directly to walk font resource dictionaries and content streams for font
# style recovery (see crates/kopitiam-pdf/src/font_resources.rs) -- work
# `pdf-extract`'s own `OutputDev` callback API does not expose. Pure Rust,
# no new C/C++ surface.
lopdf = "0.42"
# Pure-Rust baseline/progressive JPEG decoder for the MuPDF port's image layer
# (crates/kopitiam-pdf/src/mupdf/page_image.rs). PDF stores scanned pages and
# photos as DCTDecode (JPEG) Image XObjects; MuPDF decodes them via libjpeg
# (`source/fitz/load-jpeg.c`, `<jpeglib.h>`). We substitute `zune-jpeg`, which
# is pure Rust with NO C toolchain -- it has `build = false` and a single
# dependency, `zune-core` (also pure Rust) -- keeping the "Pure Rust Core"
# standard (cf. the miniz_oxide note above: the C codec is replaced by its
# pure-Rust equivalent, the surrounding image plumbing stays translated from
# MuPDF). MIT/Apache-2.0/Zlib licensed. See AID-0051.
zune-jpeg = "0.5"

# Semantic Runtime knowledge providers
cargo_metadata = "0.23"
rustdoc-types = "0.60"
url = "2"
# Already in the tree as `url`'s own dependency, so this costs no extra compile.
# Declared directly because `uri_to_path` needs to percent-decode a `file:` URI
# path itself when the platform's `to_file_path()` refuses it — see
# `kopitiam-semantic::lsp_types::uri_to_path`. Hand-rolling a decoder there
# would be a UTF-8 bug waiting to happen.
percent-encoding = "2"
similar = "3"
redb = "4"
tantivy = "0.26"
tempfile = "3.27.0"

# Kopitiam Runtime: memory-mapping for model weight files. Pure Rust (a thin
# safe wrapper over OS mmap syscalls, no C compiler or build step involved)
# and already present in Cargo.lock as a transitive dependency of tantivy,
# so promoting it to a workspace dependency for kopitiam-loader adds no new
# supply-chain surface.
memmap2 = "0.9"

# kvim's `:term` terminal emulator. Both pure Rust and both build for
# aarch64-linux-android (Termux has ptys), which is what makes an on-tablet
# terminal possible.
#
# `portable-pty` (wezterm's) opens the pseudo-terminal and spawns the shell.
# It calls libc's `openpty`/`ioctl` via FFI -- that is the OS's own pty
# interface, NOT a bundled C library that Cargo has to compile. Same Pure Rust
# Core standard we already accept for `sysinfo` (reads /proc) and `memmap2`
# (wraps mmap): a thin safe wrapper over a syscall is pure Rust; a `cc`-built
# C dependency is not. No `cc`, no CMake, no vendored C in the build.
#
# `vt100` (built on alacritty's `vte`) is the ANSI/VT parser: it eats the raw
# pty byte stream and maintains a `Screen` grid of cells (glyph + fg/bg +
# attrs + cursor) that kvim paints straight into a ratatui window. Pure Rust,
# maintained, no C. See crates/kopitiam-neovim/src/termemu.rs and AID-0049.
#
# WHY 0.15 AND NOT 0.16, HOR: `vt100` 0.16 bumped to `unicode-width ^0.2.1`,
# but `ratatui` 0.29.0 HARD-PINS `unicode-width =0.2.0` (exact `=`, because
# unicode-width 0.2.1 changed some East-Asian widths and ratatui froze it).
# One version per semver-compat range, so 0.16 cannot coexist with our pinned
# ratatui -- Cargo refuses to resolve. `vt100` 0.15.2 depends on the 0.1 line
# (`unicode-width 0.1.14`, a different major that unifies fine), so it slots in
# clean. When ratatui unpins unicode-width (or we bump ratatui), revisit 0.16.
portable-pty = "0.9"
vt100 = "0.15"

# System info (RAM available/total, CPU core count + usage, per-process RSS).
# Pure Rust, Android-capable (reads /proc under the hood on Linux/Android), and
# it is the crate `bottom`/`btm` is built on -- so it keeps the Pure Rust Core
# promise while being battle-tested. kvim uses it as a LIBRARY only; never shell
# out to any external monitoring binary (won't exist on the Android tablet).
# One dep, three consumers in kvim: the resource-aware LSP guard estimate, the
# LSP startup progress-bar ETA (live CPU usage), and a future runtime
# memory-cap-and-kill guard (per-process RSS). See
# crates/kopitiam-neovim/src/lsp/resource_guard.rs.
sysinfo = "0.37"

# Internal crates. `version` is required alongside `path` so that
# `cargo publish` can strip the (registry-meaningless) local path and embed
# a real dependency version in the published manifest -- see
# scripts/publish.sh for the required publish order.
kopitiam-pdf = { path = "crates/kopitiam-pdf", version = "0.2.4" }
kopitiam-plot = { path = "crates/kopitiam-plot", version = "0.2.4" }
kopitiam-document = { path = "crates/kopitiam-document", version = "0.2.4" }
kopitiam-markdown = { path = "crates/kopitiam-markdown", version = "0.2.4" }
kopitiam-ontology = { path = "crates/kopitiam-ontology", version = "0.2.4" }
kopitiam-semantic = { path = "crates/kopitiam-semantic", version = "0.2.4" }
kopitiam-knowledge = { path = "crates/kopitiam-knowledge", version = "0.2.4" }
kopitiam-index = { path = "crates/kopitiam-index", version = "0.2.4" }
kopitiam-search = { path = "crates/kopitiam-search", version = "0.2.4" }
kopitiam-workspace = { path = "crates/kopitiam-workspace", version = "0.2.4" }
# First-time crates.io release, debuting at 0.1.0 (the workspace is 0.1.8):
# their own manifests pin version = "0.1.0", so the req here must match.
kopitiam-workflow = { path = "crates/kopitiam-workflow", version = "0.2.4" }
kopitiam-translation = { path = "crates/kopitiam-translation", version = "0.2.4" }
kopitiam-ai = { path = "crates/kopitiam-ai", version = "0.2.4" }
kopitiam-config = { path = "crates/kopitiam-config", version = "0.2.4" }

# A pure-Rust Lua 5.1 interpreter (no C, no mlua -- see AID-0003 and AID-0007).
# kvim consumes it to execute the user's Lua config, which it can already
# discover but not run.
kopitiam-lua = { path = "crates/kopitiam-lua", version = "0.2.4" }
kopitiam-syntax = { path = "crates/kopitiam-syntax", version = "0.2.4" }
kopitiam-snippet = { path = "crates/kopitiam-snippet", version = "0.2.4" }

# The preemptive resource budgeter: estimate RAM/CPU cost BEFORE launching
# rust-analyzer or loading a gguf, so a small Android tablet degrades gracefully
# instead of getting OOM-killed (uncatchable SIGKILL/SIGABRT/SIGBUS). ONE
# budgeter, two clients. Generalises kvim's shipped LSP guard (AID-0037); kvim's
# lsp/resource_guard.rs will later delegate to this (see the follow-up bead).
kopitiam-resource = { path = "crates/kopitiam-resource", version = "0.2.4" }

# The Rust-gated tool layer for the AI agent loop (temp_ai_design.md §10.1 #5 /
# §10.3). The model PROPOSES a search/read/write/edit/run call; Rust DISPOSES --
# every call is schema-checked, confined inside the workspace, and budget-checked
# BEFORE it runs. kopitiam-workflow (the only model-invoking layer) drives this;
# it never sits inside a UI. Depends on kopitiam-resource for the §6 budget gate.
kopitiam-tools = { path = "crates/kopitiam-tools", version = "0.2.4" }

# Domain engines: policy/scheme documents -> provenance-carrying knowledge.
kopitiam-finance = { path = "crates/kopitiam-finance", version = "0.2.4" }
kopitiam-health = { path = "crates/kopitiam-health", version = "0.2.4" }
kopitiam-insurance = { path = "crates/kopitiam-insurance", version = "0.2.4" }
kopitiam-legal = { path = "crates/kopitiam-legal", version = "0.2.4" }
kopitiam-web = { path = "crates/kopitiam-web", version = "0.2.4" }

# Literature Engine: references, citations, BibTeX/BibLaTeX/Hayagriva, and the
# citation graph. Depends only on ontology + the Document Engine -- deliberately
# NOT on kopitiam-web, so a bibliography model can never grow a network
# dependency by accident (see docs/ai-decisions/AID-0018).
kopitiam-bibliography = { path = "crates/kopitiam-bibliography", version = "0.2.4" }

# Kopitiam Runtime: the CPU-first, local-first inference engine that will sit
# behind kopitiam-ai's ModelAdapter. Layered core -> tensor -> {loader,
# tokenizer} -> runtime; see docs/ai-decisions/AID-0001 for why these are
# engines under crates/ with no CLI/TUI crate of their own.
# core + tensor have graduated from their 0.0.x name-reservation seeds and now
# release in lockstep with the workspace (0.1.8); models likewise. loader,
# tokenizer and runtime are first-time crates.io releases debuting at 0.1.0
# (their own manifests pin version = "0.1.0"), so those reqs stay at 0.1.0.
kopitiam-core = { path = "crates/kopitiam-core", version = "0.2.4" }
kopitiam-tensor = { path = "crates/kopitiam-tensor", version = "0.2.4" }
kopitiam-models = { path = "crates/kopitiam-models", version = "0.2.4" }
kopitiam-loader = { path = "crates/kopitiam-loader", version = "0.2.4" }
kopitiam-tokenizer = { path = "crates/kopitiam-tokenizer", version = "0.2.4" }
kopitiam-runtime = { path = "crates/kopitiam-runtime", version = "0.2.4" }

# gitoxide (`gix`): pure-Rust Git. This is the pure-Rust-core replacement for
# kopi-beans's `git2` (vendored libgit2 + OpenSSL = a C toolchain), so `bn`
# cross-compiles to Termux/Android with NO NDK. gitoxide is pure Rust and builds
# for aarch64-linux-android.
#
# Feature choice = no C for the acceptance targets. Verified empirically (isolated
# `cargo generate-lockfile` probe against gix 0.86): the tree contains NONE of
# `git2` / `libgit2-sys` / `openssl-sys` / `libz-sys` (gix's zlib is the pure-Rust
# `flate2`/`miniz_oxide` path, matching this workspace's existing FlateDecode note).
#
# TLS nuance (documented on purpose): `blocking-network-client` ALONE is fully
# C-free (132 crates; no `ring`, no `aws-lc-sys`, no `cc`) and already covers the
# `file://` bare-remote round-trip plus `git://`/`ssh` (gix drives `ssh` as an
# external process, nothing C is linked). HTTPS to GitHub needs an HTTP transport;
# the only pure-Rust-TLS option gix exposes is
# `blocking-http-transport-reqwest-rust-tls` (reqwest + rustls). rustls in turn
# pulls `ring` + `aws-lc-sys`, which ship a little C/asm built via `cc` -- still
# NO libgit2/OpenSSL/libz, so it clears every acceptance target, but it is not
# literally zero-C. For a strictly-NDK-free Termux build prefer `ssh` remotes and
# drop the http feature; enable the reqwest-rustls feature only when HTTPS remotes
# are required. NOTE: gix 0.86 has NO high-level push (no `prepare_push`/
# `send_pack`/`push` on `Remote`; upstream issue #306 is still open) -- push must
# be built on `gix-protocol`/`gix-transport` send-pack, which is the shim the
# kopi-beans port carries. See NOTICE / kopi-beans for the migration.
gix = { version = "0.86", default-features = false, features = [
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
    "revision",
    "sha1",
] }
# WHY `sha1` and NOT `worktree-mutation`: gix gates SHA-1 object-hash support at
# RUNTIME on its OWN `sha1` feature (`config::cache::incubate::legacy_object_hash`
# is `#[cfg(feature = "sha1")]`) -- NOT on `gix-hash/sha1`. Without gix's `sha1`
# feature, opening any ordinary SHA-1 repo fails with
# "Cannot handle objects formatted as sha1". gix's `sha1` feature also flips on
# `gix-worktree-stream?/sha1`, but that is an *optional* dep only pulled in by
# `worktree-mutation` -- which kopi-beans does not use (it is a bare object/ref
# workflow, never checking out a worktree). Dropping `worktree-mutation` keeps
# `gix-worktree-stream` out of the tree entirely, so its `^0.35` pin can't bite,
# and `sha1` resolves cleanly. Still C-free: no libgit2 / OpenSSL / libz.

# NOTE: gix 0.86's `sha1` feature carries a weak `gix-worktree-stream?/sha1`
# reference cargo version-resolves. gix-worktree-stream 0.35.0 is now published
# on crates.io, so the `^0.35` pin resolves cleanly from the registry -- no
# `[patch.crates-io]` stub is needed (removing it is what makes kopi-beans
# publishable: patches don't survive `cargo publish`). The optional dep is
# still never compiled (worktree-mutation is off).

# ---------------------------------------------------------------------------
# Build profiles
# ---------------------------------------------------------------------------

[profile.release]
# CLAUDE.md mandates `--release` for every build/test/run in this workspace, so
# the release profile IS the development loop — not just what ships. Cargo's
# default release profile disables incremental compilation, which means every
# touched crate recompiles from scratch: across 31 members with wgpu and tantivy
# in the tree that turns a one-line edit into minutes of rebuild, and it is why
# `cargo test --release --workspace` felt so slow.
#
# Turning incremental back on trades a little runtime optimisation quality (the
# compiler splits work into more codegen units, so cross-unit inlining suffers
# slightly) for a large cut in rebuild time. That is the right trade here
# because the profile's dominant use is the edit-test loop. If a release ever
# needs the last few percent of runtime speed, build it with
# `CARGO_INCREMENTAL=0 cargo build --release`, which overrides this without
# editing the manifest.
incremental = true
