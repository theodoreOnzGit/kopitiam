[package]
name = "kopitiam"
# First crates.io release at 0.1.0; the workspace is 0.1.8 but these debut at 0.1.0 (maintainer directive).
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-first Semantic Runtime CLI for Rust projects: real cargo/rust-analyzer/rustdoc facts, rust-analyzer-backed rename and code actions, and a PDF-to-Markdown document engine."
readme = "README.md"
keywords = ["rust-analyzer", "semantic", "lsp", "scientific-computing"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
kopitiam-pdf = { workspace = true }
# `serde` feature on: `pdf2md --report-json` serializes the `ConversionReport`
# (recovery ratio + per-page ratios) to JSON so callers gate on it without
# parsing prose (`kopitiam_token_max.md` card I-F).
kopitiam-document = { workspace = true, features = ["serde"] }
kopitiam-markdown = { workspace = true }
kopitiam-ontology = { workspace = true }
kopitiam-semantic = { workspace = true }
# `kopitiam tokens` (token-max Task II-7): the dependency-free BPE token
# estimator (`estimate_tokens`/`estimate_tokens_by_line`). Already a workspace
# member — this is the only card that adds a CLI dependency, so it is the sole
# Cargo.lock change of this wave (the `kopitiam` package gains one edge; no new
# transitive crates, since the tokenizer's own deps — regex, serde_json,
# kopitiam-core — are all already in the tree).
kopitiam-tokenizer = { workspace = true }
kopitiam-knowledge = { workspace = true }
kopitiam-index = { workspace = true }
kopitiam-workspace = { workspace = true }
kopitiam-workflow = { workspace = true }
kopitiam-ai = { workspace = true }
kopitiam-models = { workspace = true }
# The ported Tesseract LSTM OCR engine, driving the automatic per-page OCR
# fallback in `pdf2md`/`convert_one` (token-max Task #10): rasterize a scanned
# (low-text) page, binarize + line-find, and recognize each line against the
# `.traineddata` pulled from the `kopitiam-models` store. A direct path dep
# (not in [workspace.dependencies]) pinned to the crate's own 0.1.0; its only
# dependency, `kopitiam-tensor`, is already in the tree, so this adds a single
# edge to Cargo.lock and no new transitive crates.
kopitiam-ocr = { path = "../../crates/kopitiam-ocr", version = "0.1.0" }
clap = { workspace = true }
anyhow = { workspace = true }
# `pdf2md --report-json` (card I-F) and the `<output>.index.json` sidecar
# (card I-G): serialize small local structs and the report's JSON view.
serde = { workspace = true }
serde_json = { workspace = true }
# The `kopitiam tui` chat surface. Pinned to the same ratatui the `kvim`
# editor uses (crates/kopitiam-neovim) so the workspace resolves one ratatui +
# crossterm. crossterm is used via `ratatui::crossterm` (ratatui's default
# feature re-exports it), so versions never skew.
ratatui = "0.29"
# Recursive PDF discovery for the TUI file pickers. Pure Rust over `std::fs`
# (no platform syscalls of our own), already present in Cargo.lock as a
# transitive dep, so it builds for the Android/Termux target and adds no new
# supply-chain surface.
walkdir = "2"
# Fuzzy filtering/ranking for the TUI's PDF finder. Pure Rust, fast, by the
# Helix authors; already in Cargo.lock transitively (via `nucleo`), so it is
# Android-safe and adds nothing new to the tree.
nucleo-matcher = "0.3"
# The kvim editor, launched in-process from the TUI's "kvim (Editor)" menu
# entry via `kopitiam_neovim::ui::run`. A direct path dep (kopitiam-neovim is
# not in [workspace.dependencies]); the crate itself targets aarch64-linux-android,
# so it does not compromise the Android build. Pinned to the workspace version.
kopitiam-neovim = { path = "../../crates/kopitiam-neovim", version = "0.2.1" }
# The PDF **viewer** View's image mode. `ratatui-image` auto-detects the
# terminal's graphics protocol (kitty / sixel / iTerm2) and falls back to
# Unicode half-blocks on terminals that support none of them -- which is what
# keeps the viewer Termux-safe (Termux's terminal has no graphics protocol, so
# it lands on the half-block path). Pure Rust: we take ONLY the `crossterm`
# feature (matching the app's crossterm backend) and deliberately leave
# `chafa-dyn`/`chafa-static` OFF -- those are the sole features that would link
# the `chafa` C library. `default-features = false` also drops `image-defaults`
# so no image codec (some of which want C) is pulled in; the viewer never
# decodes an image file, it rasterises pages straight to an in-memory
# `RgbaImage`. No C, no `cc`/CMake in the build.
ratatui-image = { version = "8", default-features = false, features = ["crossterm"] }
# The in-memory pixel buffer type (`image::RgbaImage` / `DynamicImage`) the
# `PageRasterizer` seam produces and `ratatui-image` consumes. Pure Rust.
# `default-features = false` drops every codec (PNG/JPEG/... , some of which
# reach for C) -- unneeded because pages are rasterised to raw RGBA in memory,
# never encoded to or decoded from a file format here.
image = { version = "0.25", default-features = false }
# The `kopitiam tui` git panel (#25): a lazygit-style, LOCAL-only git view built
# straight on the pure-Rust `gitoxide` (`gix`). Uses the SAME workspace `gix`
# (0.86, C-free features) that `kopi-beans` already resolves, so no new gix copy
# enters the tree. Feature set is the workspace one: `revision` (pulls in
# `index`, so `open_index()`/index writes work), `sha1`, and the blocking
# network client. NOTE: `status`, `blob-diff`, `dirwalk`, and `worktree-mutation`
# are OFF, so the panel computes status by comparing HEAD-tree/index/worktree
# itself, diffs with a pure-Rust line differ, and GATES worktree checkout + push
# (see `tui/git_ops.rs`). No `git` binary is ever shelled out to.
gix = { workspace = true }

[dev-dependencies]
# Used by adapter-selection tests to build throwaway model stores in a
# tempdir, so presence/absence decisions are exercised without touching the
# user's real ~/.cache/kopitiam/models.
tempfile = { workspace = true }
