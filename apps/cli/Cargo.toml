[package]
name = "kopitiam"
# First crates.io release at 0.1.0; the workspace is 0.1.8 but these debut at 0.1.0 (maintainer directive).
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-first Semantic Runtime CLI for Rust projects: real cargo/rust-analyzer/rustdoc facts, rust-analyzer-backed rename and code actions, and a PDF-to-Markdown document engine."
readme = "README.md"
keywords = ["rust-analyzer", "semantic", "lsp", "scientific-computing"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
kopitiam-pdf = { workspace = true }
kopitiam-document = { workspace = true }
kopitiam-markdown = { workspace = true }
kopitiam-ontology = { workspace = true }
kopitiam-semantic = { workspace = true }
kopitiam-knowledge = { workspace = true }
kopitiam-index = { workspace = true }
kopitiam-workspace = { workspace = true }
kopitiam-workflow = { workspace = true }
kopitiam-ai = { workspace = true }
kopitiam-models = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
# The `kopitiam tui` chat surface. Pinned to the same ratatui the `kvim`
# editor uses (crates/kopitiam-neovim) so the workspace resolves one ratatui +
# crossterm. crossterm is used via `ratatui::crossterm` (ratatui's default
# feature re-exports it), so versions never skew.
ratatui = "0.29"
# Recursive PDF discovery for the TUI file pickers. Pure Rust over `std::fs`
# (no platform syscalls of our own), already present in Cargo.lock as a
# transitive dep, so it builds for the Android/Termux target and adds no new
# supply-chain surface.
walkdir = "2"
# Fuzzy filtering/ranking for the TUI's PDF finder. Pure Rust, fast, by the
# Helix authors; already in Cargo.lock transitively (via `nucleo`), so it is
# Android-safe and adds nothing new to the tree.
nucleo-matcher = "0.3"
# The kvim editor, launched in-process from the TUI's "kvim (Editor)" menu
# entry via `kopitiam_neovim::ui::run`. A direct path dep (kopitiam-neovim is
# not in [workspace.dependencies]); the crate itself targets aarch64-linux-android,
# so it does not compromise the Android build. Pinned to the workspace version.
kopitiam-neovim = { path = "../../crates/kopitiam-neovim", version = "0.2.0" }

[dev-dependencies]
# Used by adapter-selection tests to build throwaway model stores in a
# tempdir, so presence/absence decisions are exercised without touching the
# user's real ~/.cache/kopitiam/models.
tempfile = { workspace = true }
